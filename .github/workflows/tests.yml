# From https://github.com/actions/starter-workflows
#
# Potential todos (ref DAPPER)
# - Compute test coverage and submit to coveralls.io
# - Also config for macOS and/or Windows
# - Also config for conda

name: CI tests

on:
  push:
    branches:
      - '*'
      # - main
      # - master
  pull_request:
    branches:
      - '*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Run ruff
      run: ruff check src tests

  bundled:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history and tags, so setuptools-scm can derive the version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      # The versions of uv.lock, and an error if it no longer matches pyproject.toml.
      # The minires extra: else the MiniRes tests are skipped.
      run: uv sync --locked --extra dev --extra minires --python ${{ matrix.python-version }}
    - name: Launch tests
      run: |
        uv run --no-sync pytest --cov=src --cov-report=term
